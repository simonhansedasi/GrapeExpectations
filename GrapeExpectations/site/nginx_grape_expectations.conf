# Reference copy. Apply the actual server block on the Hetzner box by
# copying the cert directives from a confirmed-live simonhansedasi.com
# subdomain (e.g. trivia or professionalism) rather than trusting this
# file's cert lines blindly -- see project README for why.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grape-expectations.simonhansedasi.com;

    # ssl_certificate / ssl_certificate_key: copy from a live subdomain's
    # working config on the server (certbot-issued, per reference_hosting
    # memory) rather than assuming the Cloudflare-origin-cert path some
    # older local repo copies (e.g. datacenter_siting/nginx.conf) show.

    root /var/www/grape-expectations;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name grape-expectations.simonhansedasi.com;
    return 301 https://$host$request_uri;
}
